<style>
:root{--ink:#10302f;--paper:#f3f6f5;--card:#fff;--txt:#14201f;--mut:#5b6b69;--acc:#e9a820;--ok:#1f8a5b;--bad:#c8412f;--warn:#b97a0a;--line:#dbe3e1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#0a1f1e;--paper:#0e1a19;--card:#152624;--txt:#e6efed;--mut:#93a8a5;--ok:#4cc38a;--bad:#ef7b6a;--warn:#e9a820;--line:#27403d;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#0a1f1e;--paper:#0e1a19;--card:#152624;--txt:#e6efed;--mut:#93a8a5;--ok:#4cc38a;--bad:#ef7b6a;--warn:#e9a820;--line:#27403d;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--txt);font:400 15px/1.5 "Instrument Sans",system-ui,sans-serif;display:flex;min-height:100vh}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,serif;margin:0;letter-spacing:-.01em}
nav{width:220px;background:var(--ink);color:#e8f1ef;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex-shrink:0}
nav .logo{font:700 22px "Bricolage Grotesque",serif;padding:0 10px 18px}
nav .logo i{color:var(--acc);font-style:normal}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;color:#b9cdc9}
nav button:hover{background:rgba(255,255,255,.08)}
nav button[aria-current=page]{background:var(--acc);color:#10302f;font-weight:600}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav .sp{flex:1}
main{flex:1;min-width:0;padding:28px clamp(16px,4vw,44px) 60px;max-width:1100px}
header.top{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:30px}
.sub{color:var(--mut);margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{font-size:18px;margin-bottom:12px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:20px}
.stats div{min-width:110px}.stats b{display:block;font:700 26px "Bricolage Grotesque",serif}.stats span{color:var(--mut);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--txt);min-width:0}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--ink);color:#fff}
.btn.acc{background:var(--acc);color:#10302f}.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:13px}.btn.del{background:transparent;color:var(--bad);border:1px solid var(--line)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mut);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;border:0;background:transparent;color:var(--txt);padding:6px 12px;cursor:pointer}
.seg button.on[data-s=present]{background:var(--ok);color:#fff}.seg button.on[data-s=absent]{background:var(--bad);color:#fff}.seg button.on[data-s=late]{background:var(--acc);color:#10302f}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--mut)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.watch{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.watch:last-child{border:0}
.empty{color:var(--mut);padding:14px 0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dow{text-align:center;color:var(--mut);font-size:12px}
.day{min-height:84px;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:12px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.ev{border-radius:4px;padding:1px 4px;background:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ev.ferie{color:var(--bad)}.ev.vac{color:var(--warn)}.ev.wk{color:var(--ok)}
@media (max-width:720px){.day{min-height:56px}}
.scard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--acc);border-radius:12px;padding:14px 16px;margin-bottom:10px;flex-wrap:wrap}
.num{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#10302f;display:grid;place-items:center;font-weight:600;flex-shrink:0}
.grip{cursor:grab;color:var(--mut);background:var(--paper);border-radius:6px;padding:10px 7px;user-select:none;line-height:1}
.sbody{flex:1;min-width:200px}.shead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sname{font:700 18px "Bricolage Grotesque",Georgia,serif;text-transform:uppercase}
.sline{color:var(--mut);margin-top:6px;font-size:14px}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:500}
.pill.cl{background:color-mix(in srgb,var(--acc) 28%,var(--card));color:var(--txt)}
.pill.f{background:color-mix(in srgb,var(--bad) 18%,var(--card));color:var(--bad)}
.pill.m{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.arrows{display:flex;flex-direction:column;gap:4px}
.ab{width:30px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--txt);cursor:pointer}.ab:hover:not(:disabled){background:var(--acc);color:#10302f}.ab:disabled{opacity:.4;cursor:default}
.btn.yel{background:var(--acc);color:#10302f}.btn.red{background:transparent;color:var(--bad);border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,var(--ink),color-mix(in srgb,var(--ink) 55%,#1f8a8a));color:#fff;border-radius:16px;padding:22px 24px;margin-bottom:18px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--acc);opacity:.18}
.hero h2{font-size:24px;color:#fff;margin:0}.hero p{margin:4px 0 0;color:#cfe3df}.hero .hl{color:#fff;font-weight:600;margin-top:10px}
.hq{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.chk{display:flex;flex-direction:row;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);color:var(--txt);font-size:15px;cursor:pointer}.chk:last-child{border:0}.chk input{width:18px;height:18px}.chk span:first-of-type{flex:1}
.btn.glass{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 22%,var(--card));font-size:18px;margin-bottom:6px}
.kpi b{font:700 26px "Bricolage Grotesque",Georgia,serif;line-height:1.1}.kl{color:var(--mut);font-size:13px}.ks{color:var(--mut);font-size:12px;margin-top:4px}
.bar{height:6px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.dcols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
@media (max-width:900px){.dcols{grid-template-columns:1fr}}
.wi{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.wi:last-of-type{border:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex-shrink:0}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--warn)}.chip.bad{background:color-mix(in srgb,var(--bad) 16%,var(--card));color:var(--bad)}.chip.info{background:var(--paper);color:var(--mut);border:1px solid var(--line)}
.hb{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}.hb>span{width:46px;color:var(--mut)}.hb .bar{flex:1;margin:0;height:10px}.hb b{width:24px;text-align:end;font-weight:600}
.cbars{display:flex;gap:8px;align-items:flex-end;height:150px}.cb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}.cbv{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--paper);border-radius:8px;overflow:hidden}.cbv i{width:100%;background:var(--ok);border-radius:8px 8px 0 0}.cb span{font-size:12px;color:var(--mut)}.cb small{font-size:11px;color:var(--mut)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.pbtns{display:flex;gap:4px}
.pb{min-width:32px;height:32px;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:8px;cursor:pointer;font:inherit}.pb.on{background:var(--acc);color:#10302f;border-color:var(--acc);font-weight:600}.pb:disabled{opacity:.4;cursor:default}
.psz{flex-direction:row;align-items:center;gap:6px}
.dcard{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--acc);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.dhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}.dact{display:flex;gap:6px;flex-wrap:wrap}
.dt{font:700 17px "Bricolage Grotesque",Georgia,serif}
.dstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-top:12px}
.lcard{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}.lcard.done{border-inline-start-color:var(--ok)}.lcard.late{border-inline-start-color:var(--bad)}.lcard.today{border-inline-start-color:var(--acc)}.lcard.soon{border-inline-start-color:var(--mut)}
.lnext{background:color-mix(in srgb,var(--acc) 22%,var(--card));border-radius:10px;padding:8px 10px;margin-top:10px;font-size:14px}
.ttgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.ttcol{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}.ttcol.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.tts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;background:var(--paper);border-radius:8px;padding:5px 7px}.tts.now{background:color-mix(in srgb,var(--ok) 20%,var(--card))}.tts .x{margin-inline-start:auto;border:0;background:transparent;color:var(--mut);cursor:pointer;font-size:16px;line-height:1}
.st{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.st span{display:block;font-size:12px;color:var(--mut)}.st b{font:700 18px "Bricolage Grotesque",Georgia,serif}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--txt);width:min(720px,94vw);max-height:86vh;padding:20px}
dialog::backdrop{background:rgba(5,20,19,.55)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast{width:max-content;max-width:92vw;text-align:center;z-index:50}.toast.show{opacity:1}.toast.act{pointer-events:auto}html[lang=ar] *{font-family:"Cairo","Segoe UI",Tahoma,system-ui,sans-serif}html[lang=ar] textarea[readonly]{direction:ltr;text-align:left}.toast button{font:inherit;font-weight:600;border:0;background:var(--acc);color:#10302f;border-radius:99px;padding:3px 12px;margin-inline-start:10px;cursor:pointer}
@media (max-width:720px){body{flex-direction:column}nav{width:100%;height:auto;position:sticky;top:0;flex-direction:row;overflow-x:auto;padding:8px;z-index:5;gap:2px}nav .logo,nav .sp{display:none}nav button{white-space:nowrap;padding:8px 10px}}
#syn{position:fixed;inset-inline-end:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:46px;height:46px;padding:0;border-radius:50%;border:2px solid #fff;background:var(--mut);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#syn svg{width:23px;height:23px}
#syn.ok{background:var(--ok)}#syn.run{background:#e0a800;color:#3a2a00}#syn.run svg{animation:synr 1s linear infinite}#syn.err{background:var(--bad)}
@keyframes synr{to{transform:rotate(360deg)}}
@media print{#syn{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<body>
<nav id="nav" aria-label="Navigation principale"></nav>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>
<button id="syn" type="button" onclick="synDlg()" aria-label="Synchronisation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg></button>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={students:[],assign:[],grades:{},att:{}};
try{const r=localStorage.getItem('edumanager');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('edumanager',JSON.stringify(S))}catch(e){toast('Sauvegarde impossible dans ce navigateur')}try{if(GH().auto)ghAutoSave()}catch(e){}try{localStorage.setItem('em_mod',String(Date.now()));syncSoon()}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const W={controle:.75,examen:.75,devoir:.15,projet:.15,correction:.1};
const TN={controle:'Contrôle',examen:'Examen',devoir:'Devoir',projet:'Projet',correction:'Correction des cahiers'};
const VIEWS={dash:'Tableau de bord',students:'Élèves',att:'Présences',ct:'Cahier de texte',work:'Devoirs',avg:'Moyennes',notes:'Sélection & Notes',csv:'CSV Moodle',cal:'Calendrier',data:'Export / Import'};
function localISO(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
let view='dash',cls='',date=localISO();
let attTab='in',hs='',hm=date.slice(0,7),wd=date;
const classes=()=>[...new Set(S.students.map(s=>s.cls))].sort();
/* Ordre des listes : « liste » = ordre de S.students (celui du fichier Excel importé), ou alphabétique (nom / prénom) */
function ordList(l){const m=S.ordMode||'liste';if(m==='liste')return l;const c=(x,y)=>(x||'').localeCompare(y||'','fr',{sensitivity:'base'});return l.slice().sort((a,b)=>c(a.cls,b.cls)||(m==='prenom'?c(a.first,b.first)||c(a.last,b.last):c(a.last,b.last)||c(a.first,b.first)))}
const inCls=c=>ordList(S.students.filter(s=>!c||s.cls===c));
const opts=(list,sel,all)=>(all?`<option value="">${all}</option>`:'')+list.map(v=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(v)}</option>`).join('');
let tt;function toast(m,undo){const t=$('#toast');t.textContent=m;if(undo){const b=document.createElement('button');b.type='button';b.textContent='Annuler';b.onclick=()=>{clearTimeout(tt);t.classList.remove('show','act');undo()};t.append(b)}t.classList.toggle('act',!!undo);t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show','act'),undo?8000:2200)}
/* Annuler : photo complète des données avant une suppression / un import, restaurée en un clic */
const snap=()=>JSON.stringify(S);
const undoer=u=>()=>{try{S=Object.assign({students:[],assign:[],grades:{},att:{}},JSON.parse(u));cls='';save();render();toast('Action annulée')}catch(e){toast('Annulation impossible')}};

/* Moyenne : seules les notes existantes comptent (poids : contrôle/examen 75 %, devoir/projet 15 %, correction 10 %) */
function calc(sid,sem){
  const s=S.students.find(x=>x.id===sid);const inc=[],exc=[];let tw=0,t=0;
  if(!s)return{avg:null,inc,exc,tw,t};
  S.assign.filter(a=>a.cls===s.cls||a.cls==='toutes').forEach(a=>{
    if(sem&&(a.sem||'S1')!==sem)return;
    if(a.archived){exc.push({a,why:'Archivé'});return}
    const g=S.grades[a.id+'_'+sid],n=parseFloat(g);
    if(g===undefined||g===''||isNaN(n)){exc.push({a,why:'Aucune note'});return}
    const w=W[a.type]||0;tw+=w;t+=n*w;inc.push({a,n,w});
  });
  return{avg:tw>0?t/tw:null,inc,exc,tw,t};
}
const fmt=v=>v==null?'—':(Math.round(v*10)/10).toFixed(1);
const activeFor=s=>S.assign.some(a=>!a.archived&&(a.cls===s.cls||a.cls==='toutes'));

function nav(){
  $('#nav').innerHTML='<div class="logo">Edu<i>Manager</i></div>'+Object.entries(VIEWS).map(([k,v])=>`<button ${k===view?'aria-current="page"':''} onclick="go('${k}')">${v}</button>`).join('')+'<div class="sp"></div><button onclick="showRem()">Rappels'+(reminders().length+missedCalls().length?' ('+(reminders().length+missedCalls().length)+')':'')+'</button><button onclick="theme()">Changer de thème</button><button onclick="setLang()">'+(LANG==='ar'?'Français':'العربية')+'</button>';
}
function theme(){const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark'}
function go(v){view=v;if((v==='att'||v==='ct'||v==='dash')&&!noAuto)autoCls(v);noAuto=false;render()}
function head(t,s,extra){return `<header class="top"><div><h1>${t}</h1>${s?`<p class="sub">${s}</p>`:''}</div>${extra||''}</header>`}
const clsPick=(all)=>`<label>Classe<select onchange="cls=this.value;render()">${opts(classes(),cls,all)}</select></label>`;

const V={
dash(){
  const st=S.students,avgs=st.map(s=>calc(s.id).avg).filter(a=>a!=null);
  const recs=Object.values(S.att),pres=recs.filter(r=>r!=='absent').length;
  const watch=[];
  const ab=absCount();st.forEach(s=>{const a=calc(s.id).avg,abs=ab[s.id]||0,why=[];
    if(a==null){if(activeFor(s))why.push('Aucune note enregistrée')}else if(a<10)why.push('Moyenne '+fmt(a)+'/20');

function csvRows(t){

  const d=[';',',','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c=''}

/* ===== Feuille d’appel vierge (PDF à remplir à la main) ===== */
function blankDlg(){const cl=classes();if(!cl.length)return toast('Aucune classe : ajoutez d’abord des élèves');
  $('#dlg').innerHTML=`<h2>Feuille d’appel vierge (PDF)</h2><p class="sub">Liste de la classe avec des colonnes vides à remplir à la main (une colonne par séance).</p><div class="row" style="margin:12px 0"><label>Classe<select id="bk1">${opts(cl,cl.includes(cls)?cls:cl[0])}</select></label><label>Colonnes<input type="number" id="bk2" min="5" max="40" value="20" style="width:90px"></label><label style="flex:1;min-width:180px">Mois / titre (facultatif)<input id="bk3" placeholder="ex. Octobre 2026"></label></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" onclick="closeD()">Annuler</button><button class="btn acc" onclick="blankGo()">Générer le PDF</button></div>`;$('#dlg').showModal()}
function blankGo(){const c=$('#bk1').value,n=Math.min(40,Math.max(5,Math.round(+$('#bk2').value)||20)),t=$('#bk3').value.trim(),L=inCls(c);
  if(!L.length)return toast('Aucun élève dans cette classe');
  closeD();const blank=Array(n).fill('');
  pdf('Feuille d’appel - '+c,['N°','Nom','Prénom',...blank],L.map((x,i)=>[i+1,x.last,x.first,...blank]),'feuille-appel-'+slugF(c)+'.pdf',{land:true,grid:true,fs:9,sub:t||(L.length+' élève(s)'),cols:{0:{cellWidth:9},1:{cellWidth:34},2:{cellWidth:30}}})}
/* Échap sur une fenêtre : on rafraîchit la page comme le fait « Fermer » */
$('#dlg').addEventListener('cancel',()=>setTimeout(()=>{try{keep()}catch(e){}},0));
/* ===== Absences du tableau de bord : par mois / semestre / année ===== */
const PERL={month:'ce mois',sem:'ce semestre',year:'cette année'};
const absPer=()=>PERL[S.absPer]?S.absPer:'month';
function absRange(){const p=absPer(),t=today(),y=+t.slice(0,4),m=+t.slice(5,7);
  if(p==='month')return[t.slice(0,7)+'-01',t.slice(0,7)+'-31'];
  if(p==='sem'){if(m>=9)return[y+'-09-01',(y+1)+'-01-31'];if(m===1)return[(y-1)+'-09-01',y+'-01-31'];return[y+'-02-01',y+'-08-31']}
  return['0000-01-01','9999-12-31']}
function absCount(){const[a,b]=absRange(),o={};Object.keys(S.att).forEach(k=>{if(S.att[k]!=='absent')return;const d=k.slice(0,10);if(d<a||d>b)return;const id=k.slice(11);o[id]=(o[id]||0)+1});return o}
function setAbsPer(v){S.absPer=v;save();keep()}
/* ===== Année scolaire : archivage et nouvelle année (les élèves restent) ===== */
const YKEYS=['students','assign','grades','att','cmt','cmtM','lessons','mdl','cal','tt'],YDEF={students:[],assign:[],grades:{},att:{}};
const clone=v=>JSON.parse(JSON.stringify(v));
function schoolYear(){const t=today(),y=+t.slice(0,4);return +t.slice(5,7)>=8?y+'-'+(y+1):(y-1)+'-'+y}
function nextYear(v){const m=String(v).match(/(\d{4})\D+(\d{4})/);return m?(+m[1]+1)+'-'+(+m[2]+1):''}
function yData(){const o={};YKEYS.forEach(k=>{if(S[k]!==undefined)o[k]=clone(S[k])});return o}
function withData(data,fn){const old=S;S=Object.assign({students:[],assign:[],grades:{},att:{}},data);try{return fn()}finally{S=old}}
function yearCard(){const yr=S.year||schoolYear(),A=(S.archives||[]).slice().sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  return `<div class="card"><h2>Année scolaire</h2><p>Année en cours : <b>${esc(yr)}</b> · ${S.students.length} élève(s)</p><div class="row"><button class="btn acc" onclick="newYear()">Clôturer l’année et en commencer une nouvelle</button><button class="btn ghost" onclick="renYear()">Modifier le nom</button></div><p class="sub" style="margin-top:8px">La clôture archive notes, présences, devoirs et leçons, puis repart à zéro. Les élèves sont conservés (vous pouvez changer leur classe).</p>`+
  (A.length?`<h3 style="margin:16px 0 6px">Années archivées</h3><div class="tw"><table><thead><tr><th>Année</th><th>Archivée le</th><th>Élèves</th><th>Évaluations</th><th>Présences</th><th></th></tr></thead><tbody>${A.map(a=>`<tr><td><b>${esc(a.year)}</b></td><td>${a.at?dateFr(a.at):'—'}</td><td>${(a.data.students||[]).length}</td><td>${(a.data.assign||[]).length}</td><td>${Object.keys(a.data.att||{}).length}</td><td><button class="btn ghost sm" onclick="arcOpen('${a.id}')">Consulter</button> <button class="btn ghost sm" onclick="arcExp('${a.id}')">Exporter</button> <button class="btn ghost sm" onclick="arcReopen('${a.id}')">Rouvrir</button> <button class="btn del sm" onclick="arcDel('${a.id}')">Supprimer</button></td></tr>`).join('')}</tbody></table></div>`:'')+`</div>`}
function renYear(){$('#dlg').innerHTML=`<h2>Année scolaire en cours</h2><div class="row" style="margin:12px 0"><label>Nom<input id="ry" value="${esc(S.year||schoolYear())}" placeholder="2026-2027"></label></div><div style="text-align:end;display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" onclick="closeD()">Annuler</button><button class="btn acc" onclick="saveYear()">Enregistrer</button></div>`;$('#dlg').showModal()}
function saveYear(){const v=$('#ry').value.trim();if(!v)return toast('Indiquez un nom');S.year=v;save();closeD();toast('Année modifiée')}
function newYear(){
  if(!S.students.length&&!S.assign.length&&!Object.keys(S.att).length)return toast('Rien à archiver pour le moment');
  const yr=S.year||schoolYear(),cl=classes();
  $('#dlg').innerHTML=`<h2>Clôturer l’année ${esc(yr)}</h2><p>L’année sera <b>archivée</b> (élèves, notes, présences, devoirs, leçons). Les <b>élèves restent</b> dans l’application ; notes, présences, devoirs et leçons repartent à zéro.</p><div class="row" style="margin:12px 0"><label>Nouvelle année scolaire<input id="ny0" value="${esc(nextYear(yr))}" placeholder="2027-2028"></label></div>`+
  (cl.length?`<h3 style="margin:8px 0 4px">Passage de classe</h3><p class="sub">Changez le nom si la classe change (ex. 1AC-1 → 2AC-1). Laissez tel quel pour garder la classe.</p><div class="tw" style="max-height:30vh;overflow:auto"><table><tbody>${cl.map(c=>`<tr><td>${esc(c)} <span class="sub">(${inCls(c).length})</span></td><td>→</td><td><input data-oc="${esc(c)}" value="${esc(c)}" style="width:100%"></td></tr>`).join('')}</tbody></table></div>`:'')+
  `<label class="chk"><input type="checkbox" id="ny1" checked><span>Garder l’emploi du temps</span></label><label class="chk"><input type="checkbox" id="ny2"><span>Garder le calendrier (vacances, jours fériés, événements)</span></label><div style="text-align:end;margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" onclick="closeD()">Annuler</button><button class="btn acc" onclick="doNewYear()">Archiver et commencer</button></div>`;
  $('#dlg').showModal()}
function doNewYear(){const ny=$('#ny0').value.trim();if(!ny)return toast('Indiquez le nom de la nouvelle année');
  const map={};document.querySelectorAll('#dlg [data-oc]').forEach(i=>{const n=i.value.trim();if(n&&n!==i.dataset.oc)map[i.dataset.oc]=n});
  const keepTT=$('#ny1').checked,keepCal=$('#ny2').checked,u=snap(),yr=S.year||schoolYear();
  (S.archives=S.archives||[]).push({id:uid(),year:yr,at:today(),data:yData()});
  S.students.forEach(x=>{if(map[x.cls])x.cls=map[x.cls]});
  if(keepTT)TT().forEach(x=>{if(map[x.cls])x.cls=map[x.cls]});else S.tt=[];
  if(!keepCal)S.cal=[];
  S.assign=[];S.grades={};S.att={};S.cmt={};S.cmtM={};S.lessons=[];S.skipApp={};
  const m=M();m.lesId='';m.nodone={};m.doneN={};m.notN={};
  S.ttSince=today();S.year=ny;cls='';save();closeD();toast('Année '+yr+' archivée · nouvelle année : '+ny,undoer(u))}
const arcGet=id=>(S.archives||[]).find(x=>x.id===id);
function arcRows(a){return withData(a.data,()=>{const ab={},lt={};Object.keys(S.att).forEach(k=>{const id=k.slice(11),v=S.att[k];if(v==='absent')ab[id]=(ab[id]||0)+1;else if(v==='late')lt[id]=(lt[id]||0)+1});
  return[['Nom','Prénom','Classe','Moy. S1','Moy. S2','Moy. année','Absences','Retards'],...S.students.map(x=>[x.last,x.first,x.cls,fmt(calc(x.id,'S1').avg),fmt(calc(x.id,'S2').avg),fmt(calc(x.id).avg),ab[x.id]||0,lt[x.id]||0])]})}
function arcOpen(id){const a=arcGet(id);if(!a)return;
  $('#dlg').innerHTML=`<h2>Année ${esc(a.year)}</h2><p class="sub">Archivée le ${a.at?dateFr(a.at):'—'} · lecture seule</p><div class="tw" style="max-height:52vh;overflow:auto">${tbl(arcRows(a))}</div><div style="text-align:end;margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" onclick="arcXl('${a.id}')">Exporter Excel</button><button class="btn" onclick="closeD()">Fermer</button></div>`;$('#dlg').showModal()}
function arcXl(id){const a=arcGet(id);if(a)xl('archive-'+slugF(a.year)+'.xlsx',[{name:'Année '+a.year,rows:arcRows(a)}])}
function arcExp(id){const a=arcGet(id);if(a)dl('edumanager-archive-'+slugF(a.year)+'.json',JSON.stringify(Object.assign({year:a.year},a.data),null,1))}
async function arcReopen(id){const a=arcGet(id);if(!a)return;
  if(!await ask('Rouvrir l’année '+a.year+' ?\n\nLes données de l’année en cours ('+(S.year||schoolYear())+') seront archivées automatiquement : rien n’est perdu.','Rouvrir'))return;
  const u=snap(),cur={id:uid(),year:S.year||schoolYear(),at:today(),data:yData()},d=clone(a.data);
  S.archives=S.archives.filter(x=>x.id!==id);S.archives.push(cur);
  YKEYS.forEach(k=>{if(d[k]!==undefined)S[k]=d[k];else if(YDEF[k]!==undefined)S[k]=clone(YDEF[k]);else delete S[k]});
  S.year=a.year;S.skipApp={};S.ttSince=today();cls='';save();render();toast('Année '+a.year+' rouverte',undoer(u))}
async function arcDel(id){const a=arcGet(id);if(!a)return;
  if(!await ask('Supprimer définitivement l’archive '+a.year+' ?','Supprimer'))return;
  const u=snap();S.archives=S.archives.filter(x=>x.id!==id);save();render();toast('Archive supprimée',undoer(u))}
/* ===== Installation (PWA) ===== */
let dip=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(view==='data')render()});
window.addEventListener('appinstalled',()=>{dip=null;toast('Application installée');if(view==='data')render()});
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function installApp(){if(!dip)return;dip.prompt();dip.userChoice.finally(()=>{dip=null;render()})}
function installCard(){
  if(isStandalone())return'<div class="card"><h2>📲 Installer l’application</h2><p class="ok">✅ L’application est installée sur cet appareil et fonctionne hors connexion.</p></div>';
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  return `<div class="card"><h2>📲 Installer l’application</h2>${dip?'<div class="row" style="margin-bottom:10px"><button class="btn acc" onclick="installApp()">Installer sur cet appareil</button></div>':''}<p class="sub">${ios?'<b>iPhone / iPad (Safari)</b> : touchez Partager, puis « Sur l’écran d’accueil ».':'<b>Android (Chrome)</b> : menu ⋮, puis « Installer l’application ».<br><b>PC (Chrome / Edge)</b> : icône d’installation dans la barre d’adresse, ou menu ⋮, puis « Installer EduManager ».<br><b>iPhone / iPad (Safari)</b> : Partager, puis « Sur l’écran d’accueil ».'}</p></div>`;
}
async function reset(){if(await ask('Effacer toutes les données, y compris les années archivées ?','Tout effacer')){const u=snap();S={students:[],assign:[],grades:{},att:{}};cls='';save();render();toast('Toutes les données ont été effacées',undoer(u))}}
{const s0=sessState().cur;if(s0)cls=s0.cls}
render();
{const mc=missedCalls().length,rc=reminders().length;if(mc||rc)setTimeout(()=>toast((mc?'⚠️ '+mc+' appel(s) non fait(s)':'')+(mc&&rc?' · ':'')+(rc?'🔔 '+rc+' rappel(s) cette semaine':'')),600)}
pushNotifs();setInterval(()=>{const t=today();if(t!==lastDay){if(date===lastDay)date=t;lastDay=t;render()}else if(view==='dash')keep();pushNotifs()},300000);
syPaint();
window.addEventListener('online',()=>syncNow());
window.addEventListener('offline',()=>{if(syOn()){SY.err='Hors connexion : les modifications seront envoyées au retour d’Internet.';syPaint()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow();else if(syOn()&&syDirty())syncNow()});
setInterval(()=>{if(document.visibilityState==='visible'&&syOn()&&!SY.run)syncNow()},60000);
setTimeout(()=>syncNow(),1500);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}});
</script>
