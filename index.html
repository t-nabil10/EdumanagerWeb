<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduManager</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310302f'/%3E%3Cpath d='M32 13 7 26l25 13 25-13z' fill='%23e9a820'/%3E%3Cpath d='M17 34v10c0 4.5 6.7 8 15 8s15-3.500 15-8V34l-15 7.500z' fill='%23e9a820' opacity='.85'/%3E%3Crect x='52' y='27' width='3.500' height='18' rx='1.700' fill='%23e9a820'/%3E%3C/svg%3E">
<meta name="theme-color" content="#10302f">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EduManager">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#10302f;--paper:#f3f6f5;--card:#fff;--txt:#14201f;--mut:#5b6b69;--acc:#e9a820;--ok:#1f8a5b;--bad:#c8412f;--warn:#b97a0a;--line:#dbe3e1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#0a1f1e;--paper:#0e1a19;--card:#152624;--txt:#e6efed;--mut:#93a8a5;--ok:#4cc38a;--bad:#ef7b6a;--warn:#e9a820;--line:#27403d;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#0a1f1e;--paper:#0e1a19;--card:#152624;--txt:#e6efed;--mut:#93a8a5;--ok:#4cc38a;--bad:#ef7b6a;--warn:#e9a820;--line:#27403d;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--txt);font:400 15px/1.5 "Instrument Sans",system-ui,sans-serif;display:flex;min-height:100vh}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,serif;margin:0;letter-spacing:-.01em}
nav{width:220px;background:var(--ink);color:#e8f1ef;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex-shrink:0}
nav .logo{font:700 22px "Bricolage Grotesque",serif;padding:0 10px 18px}
nav .logo i{color:var(--acc);font-style:normal}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;color:#b9cdc9}
nav button:hover{background:rgba(255,255,255,.08)}
nav button[aria-current=page]{background:var(--acc);color:#10302f;font-weight:600}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav .sp{flex:1}
main{flex:1;min-width:0;padding:28px clamp(16px,4vw,44px) 60px;max-width:1100px}
header.top{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:30px}
.sub{color:var(--mut);margin:2px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{font-size:18px;margin-bottom:12px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:20px}
.stats div{min-width:110px}.stats b{display:block;font:700 26px "Bricolage Grotesque",serif}.stats span{color:var(--mut);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--txt);min-width:0}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--ink);color:#fff}
.btn.acc{background:var(--acc);color:#10302f}.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:13px}.btn.del{background:transparent;color:var(--bad);border:1px solid var(--line)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mut);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;border:0;background:transparent;color:var(--txt);padding:6px 12px;cursor:pointer}
.seg button.on[data-s=present]{background:var(--ok);color:#fff}.seg button.on[data-s=absent]{background:var(--bad);color:#fff}.seg button.on[data-s=late]{background:var(--acc);color:#10302f}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--mut)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.watch{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.watch:last-child{border:0}
.empty{color:var(--mut);padding:14px 0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dow{text-align:center;color:var(--mut);font-size:12px}
.day{min-height:84px;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:12px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.ev{border-radius:4px;padding:1px 4px;background:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ev.ferie{color:var(--bad)}.ev.vac{color:var(--warn)}.ev.wk{color:var(--ok)}
@media (max-width:720px){.day{min-height:56px}}
.scard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:14px 16px;margin-bottom:10px;flex-wrap:wrap}
.num{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#10302f;display:grid;place-items:center;font-weight:600;flex-shrink:0}
.grip{cursor:grab;color:var(--mut);background:var(--paper);border-radius:6px;padding:10px 7px;user-select:none;line-height:1}
.sbody{flex:1;min-width:200px}.shead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sname{font:700 18px "Bricolage Grotesque",Georgia,serif;text-transform:uppercase}
.sline{color:var(--mut);margin-top:6px;font-size:14px}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:500}
.pill.cl{background:color-mix(in srgb,var(--acc) 28%,var(--card));color:var(--txt)}
.pill.f{background:color-mix(in srgb,var(--bad) 18%,var(--card));color:var(--bad)}
.pill.m{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.arrows{display:flex;flex-direction:column;gap:4px}
.ab{width:30px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--txt);cursor:pointer}.ab:hover:not(:disabled){background:var(--acc);color:#10302f}.ab:disabled{opacity:.4;cursor:default}
.btn.yel{background:var(--acc);color:#10302f}.btn.red{background:transparent;color:var(--bad);border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,var(--ink),color-mix(in srgb,var(--ink) 55%,#1f8a8a));color:#fff;border-radius:16px;padding:22px 24px;margin-bottom:18px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--acc);opacity:.18}
.hero h2{font-size:24px;color:#fff;margin:0}.hero p{margin:4px 0 0;color:#cfe3df}.hero .hl{color:#fff;font-weight:600;margin-top:10px}
.hq{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.btn.glass{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 22%,var(--card));font-size:18px;margin-bottom:6px}
.kpi b{font:700 26px "Bricolage Grotesque",Georgia,serif;line-height:1.1}.kl{color:var(--mut);font-size:13px}.ks{color:var(--mut);font-size:12px;margin-top:4px}
.bar{height:6px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.dcols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
@media (max-width:900px){.dcols{grid-template-columns:1fr}}
.wi{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.wi:last-of-type{border:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;flex-shrink:0}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--warn)}.chip.bad{background:color-mix(in srgb,var(--bad) 16%,var(--card));color:var(--bad)}.chip.info{background:var(--paper);color:var(--mut);border:1px solid var(--line)}
.hb{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}.hb>span{width:46px;color:var(--mut)}.hb .bar{flex:1;margin:0;height:10px}.hb b{width:24px;text-align:right;font-weight:600}
.cbars{display:flex;gap:8px;align-items:flex-end;height:150px}.cb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}.cbv{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--paper);border-radius:8px;overflow:hidden}.cbv i{width:100%;background:var(--ok);border-radius:8px 8px 0 0}.cb span{font-size:12px;color:var(--mut)}.cb small{font-size:11px;color:var(--mut)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.pbtns{display:flex;gap:4px}
.pb{min-width:32px;height:32px;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:8px;cursor:pointer;font:inherit}.pb.on{background:var(--acc);color:#10302f;border-color:var(--acc);font-weight:600}.pb:disabled{opacity:.4;cursor:default}
.psz{flex-direction:row;align-items:center;gap:6px}
.dcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.dhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}.dact{display:flex;gap:6px;flex-wrap:wrap}
.dt{font:700 17px "Bricolage Grotesque",Georgia,serif}
.dstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-top:12px}
.st{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.st span{display:block;font-size:12px;color:var(--mut)}.st b{font:700 18px "Bricolage Grotesque",Georgia,serif}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--txt);width:min(720px,94vw);max-height:86vh;padding:20px}
dialog::backdrop{background:rgba(5,20,19,.55)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:720px){body{flex-direction:column}nav{width:100%;height:auto;position:sticky;top:0;flex-direction:row;overflow-x:auto;padding:8px;z-index:5;gap:2px}nav .logo,nav .sp{display:none}nav button{white-space:nowrap;padding:8px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<body>
<nav id="nav" aria-label="Navigation principale"></nav>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={students:[],assign:[],grades:{},att:{}};
try{const r=localStorage.getItem('edumanager');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('edumanager',JSON.stringify(S))}catch(e){toast('Sauvegarde impossible dans ce navigateur')}try{if(GH().auto)ghAutoSave()}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const W={controle:.75,examen:.75,devoir:.15,projet:.15,correction:.1};
const TN={controle:'Contrôle',examen:'Examen',devoir:'Devoir',projet:'Projet',correction:'Correction des cahiers'};
const VIEWS={dash:'Tableau de bord',students:'Élèves',att:'Présences',work:'Devoirs',avg:'Moyennes',notes:'Sélection & Notes',csv:'CSV Moodle',cal:'Calendrier',data:'Export / Import'};
let view='dash',cls='',date=new Date().toISOString().slice(0,10);
let attTab='in',hs='',hm=date.slice(0,7),wd=date;
const classes=()=>[...new Set(S.students.map(s=>s.cls))].sort();
const inCls=c=>S.students.filter(s=>!c||s.cls===c);
const opts=(list,sel,all)=>(all?`<option value="">${all}</option>`:'')+list.map(v=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(v)}</option>`).join('');
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}

/* Moyenne : seules les notes existantes comptent (poids : contrôle/examen 75 %, devoir/projet 15 %, correction 10 %) */
function calc(sid){
  const s=S.students.find(x=>x.id===sid);const inc=[],exc=[];let tw=0,t=0;
  if(!s)return{avg:null,inc,exc,tw,t};
  S.assign.filter(a=>a.cls===s.cls||a.cls==='toutes').forEach(a=>{
    if(a.archived){exc.push({a,why:'Archivé'});return}
    const g=S.grades[a.id+'_'+sid],n=parseFloat(g);
    if(g===undefined||g===''||isNaN(n)){exc.push({a,why:'Aucune note'});return}
    const w=W[a.type]||0;tw+=w;t+=n*w;inc.push({a,n,w});
  });
  return{avg:tw>0?t/tw:null,inc,exc,tw,t};
}
const fmt=v=>v==null?'—':(Math.round(v*10)/10).toFixed(1);
const activeFor=s=>S.assign.some(a=>!a.archived&&(a.cls===s.cls||a.cls==='toutes'));

function nav(){
  $('#nav').innerHTML='<div class="logo">Edu<i>Manager</i></div>'+Object.entries(VIEWS).map(([k,v])=>`<button ${k===view?'aria-current="page"':''} onclick="go('${k}')">${v}</button>`).join('')+'<div class="sp"></div><button onclick="showRem()">Rappels'+(reminders().length?' ('+reminders().length+')':'')+'</button><button onclick="theme()">Changer de thème</button>';
}
function theme(){const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark'}
function go(v){view=v;render()}
function head(t,s,extra){return `<header class="top"><div><h1>${t}</h1>${s?`<p class="sub">${s}</p>`:''}</div>${extra||''}</header>`}
const clsPick=(all)=>`<label>Classe<select onchange="cls=this.value;render()">${opts(classes(),cls,all)}</select></label>`;

const V={
dash(){
  const st=S.students,avgs=st.map(s=>calc(s.id).avg).filter(a=>a!=null);
  const recs=Object.values(S.att),pres=recs.filter(r=>r!=='absent').length;
  const watch=[];
  st.forEach(s=>{const a=calc(s.id).avg,abs=Object.keys(S.att).filter(k=>k.endsWith('_'+s.id)&&S.att[k]==='absent').length,why=[];
    if(a==null){if(activeFor(s))why.push('Aucune note enregistrée')}else if(a<10)why.push('Moyenne '+fmt(a)+'/20');
    if(abs>3)why.push(abs+' absences');
    if(why.length)watch.push({s,why:why.join(' · '),a})});
  watch.sort((x,y)=>(x.a==null?99:x.a)-(y.a==null?99:y.a));
  return head('Tableau de bord','Vue d’ensemble de vos classes')+dashView(st,avgs,watch);
},
students(){
  const list=inCls(cls);
  return head('Élèves',list.length+' élève(s)',`<div class="row">${clsPick('Toutes les classes')}<label>Recherche<input type="search" id="sq" placeholder="Nom, prénom, classe, identifiant…" value="${esc(sq)}" oninput="searchStu(this.value)"></label><span class="sub" id="sqc">${sq?shown().length+' résultat(s)':''}</span></div>`)+
  `<div class="card"><h2>Ajouter un élève</h2><div class="row"><label>Prénom<input id="f1"></label><label>Nom<input id="f2"></label><label>Classe<input id="f3" list="cl" placeholder="ex. 3AC-1" value="${esc(cls)}"></label><label>Genre<select id="f4"><option value="">—</option><option value="F">Fille</option><option value="M">Garçon</option></select></label><label>Date de naissance<input type="date" id="f5"></label><datalist id="cl">${classes().map(c=>`<option>${esc(c)}</option>`).join('')}</datalist><button class="btn acc" onclick="addStu()">Ajouter</button></div></div>`+
  `<div class="card"><h2>Importer une liste d’élèves</h2><p class="sub" style="margin-bottom:12px">Un fichier Excel (.xlsx) ou CSV. Colonnes obligatoires : Prénom, Nom, Classe. Colonnes facultatives : Genre (F ou M) et Date de naissance (jj/mm/aaaa). Partez du modèle pour éviter les erreurs.</p><div class="row"><label>Fichier à importer<input type="file" accept=".xlsx,.xls,.csv,.txt" onchange="pickFile(this)"></label><button class="btn ghost" onclick="tpl('xlsx')">Modèle Excel</button><button class="btn ghost" onclick="tpl('csv')">Modèle CSV</button></div></div>`+
  `<div class="card"><h2>Identifiants et nettoyage</h2><div class="row"><button class="btn" onclick="genCreds()">Générer les identifiants</button><button class="btn ghost" onclick="expList()">Exporter la liste (Excel)</button><button class="btn del" onclick="delClass()">Supprimer la classe affichée</button><button class="btn del" onclick="delAll()">Supprimer tous les élèves</button></div><p class="sub" style="margin-top:10px">Format : identifiant prénom.nom, mot de passe Nom@12345. La génération s’applique à la classe choisie dans le filtre (ou à tous les élèves).</p></div>`+
  `<div id="slist">${stuList()}</div>`;
},
att(){return attBar()+(attTab==='hist'?attHist():attTab==='week'?attWeek():attTab==='mon'?attMon():V.attIn())},
attIn(){
  const list=inCls(cls);
  return head('Présences','Marquez chaque élève pour la date choisie',`<div class="row">${clsPick('Toutes les classes')}<label>Date<input type="date" value="${date}" onchange="date=this.value;render()"></label><label>Recherche<input type="search" data-rf="1" placeholder="Nom ou prénom…" oninput="rowFilter(this,'#attlist')"></label><span class="sub rc"></span><button class="btn ghost" onclick="allPres()">Tous présents</button></div>`)+
  `<div class="card tw" id="attlist">${list.length?`<table><tbody>${list.map(s=>{const v=S.att[date+'_'+s.id];return`<tr data-q="${esc(norm(nmOf(s)+' '+s.cls))}"><td>${esc(s.first)} ${esc(s.last)}</td><td><span class="tag">${esc(s.cls)}</span></td><td><div class="seg">${[['present','Présent'],['absent','Absent'],['late','Retard']].map(([k,l])=>`<button data-s="${k}" class="${v===k?'on':''}" onclick="mark('${s.id}','${k}')">${l}</button>`).join('')}</div></td></tr>`}).join('')}</tbody></table>`:'<p class="empty">Aucun élève dans cette classe.</p>'}</div>`;
},
work(){
  const as=[...S.assign].reverse();
  return head('Devoirs','Créez une évaluation puis saisissez les notes')+
  `<div class="card"><h2>Nouvelle évaluation</h2><div class="row"><label>Titre<input id="w1" oninput="this.dataset.m=1"></label><label>Type<select id="w2" onchange="autoTitle(1)">${Object.entries(TN).map(([k,v])=>`<option value="${k}">${TE[k]} ${v}</option>`).join('')}</select></label><label>Classe<select id="w3" onchange="autoTitle()"><option value="toutes">Toutes</option>${opts(classes())}</select></label><label>Matière<input id="w4" placeholder="ex. Mathématiques"></label><label>Date donnée<input type="date" id="w5" value="${date}"></label><label>Date de rendu<input type="date" id="w6"></label><button class="btn acc" onclick="addWork()">Créer</button></div></div>`+

function csvRows(t){

  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}

function parseDob(v){
  if(v==null||v==='')return'';
  const p=(y,m,d)=>{y=+y;m=+m;d=+d;if(y<100)y+=y<=new Date().getFullYear()%100?2000:1900;const t=new Date(Date.UTC(y,m-1,d));return t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d&&y>1900&&y<=new Date().getFullYear()?y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'):''};

async function xl(file,sheets){
  if(typeof ExcelJS==='undefined')return toast('ExcelJS non chargé : vérifiez la connexion');
  const wb=new ExcelJS.Workbook(),used=new Set();
  sheets.forEach(s=>{
    const n=String(s.name).replace(/[^A-Za-z0-9À-ÿ _.()-]/g,' ').trim().slice(0,28)||'Feuille';let k=n,i=2;while(used.has(k))k=n+' '+i++;used.add(k);
    const ws=wb.addWorksheet(k),w=[];s.rows.forEach(r=>{ws.addRow(r);r.forEach((v,j)=>{w[j]=Math.max(w[j]||10,String(v==null?'':v).length+2)})});
    w.forEach((x,j)=>{ws.getColumn(j+1).width=Math.min(x,42)});
    const h=ws.getRow(1);h.font={bold:true,color:{argb:'FFFFFFFF'}};h.eachCell(c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF10302F'}}});
  });

}

async function expWork(id){

  const th={style:'thin'},box={top:th,left:th,bottom:th,right:th},r2=v=>Math.round(v*100)/100;

  info.forEach((r,i)=>{const n=i+3;ws.mergeCells('A'+n+':D'+n);const k=ws.getCell('A'+n);k.value=r[0]+' : '+r[1];k.font={bold:true}});

    ws.getRow(ri).getCell(4).alignment={horizontal:'right'};ws.getRow(ri).getCell(5).alignment={horizontal:'right'};ri++;
  });
  const sr=ri+2,n=L.map(s=>S.grades[id+'_'+s.id]).filter(g=>g!==undefined);
  let st='STATISTIQUES : '+n.length+'/'+L.length+(cor?' cahiers appréciés':' élèves notés');
  if(n.length&&!cor){const mo=n.reduce((p,x)=>p+x,0)/n.length,lo=Math.min(...n),hi=Math.max(...n);st+=' - Moyenne : '+r2(mo)+'/20 ('+r2(mo/2)+'/10) - Plus basse : '+lo+' ('+r2(lo/2)+'/10) - Plus haute : '+hi+' ('+r2(hi/2)+'/10)'}

function pD(v){if(v instanceof Date){const t=new Date(v.getTime()+432e5);v=t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-'+String(t.getUTCDate()).padStart(2,'0')}
  const s=cell(v);let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/),y,o,d;
  if(m){y=+m[1];o=+m[2];d=+m[3]}else if(m=s.match(/^(\d{1,2})[-\/. ](\d{1,2})[-\/. ](\d{4})$/)){d=+m[1];o=+m[2];y=+m[3]}else return'';
  const t=new Date(Date.UTC(y,o-1,d));return t.getUTCMonth()===o-1&&t.getUTCDate()===d?y+'-'+String(o).padStart(2,'0')+'-'+String(d).padStart(2,'0'):''}

    a.forEach(x=>{const ty=norm(x[0]),t=cell(x[1]),s=pD(x[2]),e=pD(x[3]);if(!t||!s||(e&&e<s)){bad++;return}CAL().push({id:uid(),type:ty.includes('vac')?'vac':ty.includes('fer')?'ferie':'event',title:t,start:s,end:e});n++});

  csv?r.readAsText(f):r.readAsArrayBuffer(f)}

  `<div class="card"><div class="row"><label style="flex:1;min-width:220px">Titre du cours / de la leçon<input value="${esc(m.lesson)}" placeholder="Ex : Les fractions" oninput="mdlSet('lesson',this.value)"></label><label style="flex:1;min-width:200px">Feedback « ont fait »<input value="${esc(m.doneFb)}" oninput="mdlSet('doneFb',this.value)"></label><label style="flex:1;min-width:200px">Feedback « n’ont pas fait »<input value="${esc(m.notDoneFb)}" oninput="mdlSet('notDoneFb',this.value)"></label></div><div class="row" style="margin-top:10px"><label>Note par défaut « n’ont pas fait »<input type="number" step="0.5" min="0" value="${m.defNot}" onchange="mdlSet('defNot',this.value);keep()"></label><label>Note par défaut « ont fait » (si vide)<input type="number" step="0.5" min="0" value="${m.defDone}" onchange="mdlSet('defDone',this.value);keep()"></label></div></div>`+
  (L.length?`<div class="card tw" id="nlist"><div class="row" style="margin-bottom:10px;justify-content:space-between;align-items:end"><span><b class="ok">✅ ${L.length-nd}</b> ont fait · <b class="bad">❌ ${nd}</b> n’ont pas fait</span><label style="flex:1;min-width:180px">Recherche<input type="search" data-rf="1" placeholder="Nom ou prénom…" oninput="rowFilter(this,'#nlist')"></label><span class="sub rc"></span><button class="btn ghost sm" onclick="mdlReset()">Tous ont fait</button></div><table><thead><tr><th>#</th><th>Élève</th><th>N’a pas fait</th><th>Note</th></tr></thead><tbody>${L.map((s,i)=>{const no=m.nodone[s.id],v=no?m.notN[s.id]:m.doneN[s.id];return`<tr data-q="${esc(norm(nmOf(s)+' '+(s.user||udef(s))))}"><td>${i+1}</td><td>${esc(nmOf(s))} <span class="sub">(${esc(s.user||udef(s))})</span></td><td><input type="checkbox" ${no?'checked':''} onchange="mdlTog('${s.id}',this.checked)"></td><td><input type="number" step="0.5" min="0" style="width:90px" value="${v==null?'':esc(v)}" placeholder="${no?m.defNot:m.defDone}" oninput="mdlNote('${s.id}',this.value)"></td></tr>`}).join('')}</tbody></table></div>`:'<div class="card"><p class="empty">Choisissez une classe pour sélectionner les élèves.</p></div>');
}
const mPool=sc=>(sc==='a'?S.students:inCls(cls)).slice().sort((a,b)=>a.cls.localeCompare(b.cls,'fr')||(a.last+a.first).localeCompare(b.last+b.first,'fr'));
let mnRows=[],mnCol='',mstu=[];
function mdlCsv(){return head('CSV Moodle','Notes d’exercices et liste des élèves au format Moodle',clsPick('Toutes les classes'))+
  `<div class="card"><h2>Export des notes</h2><p class="sub" style="margin-bottom:12px">Une ligne par élève : user, note et feedback. Réglez la leçon et les élèves dans l’onglet « Sélection & Notes ».</p><div class="row"><label>Classes<select id="ms1"><option value="c">Classe choisie (ou toutes si aucune)</option><option value="a">Toutes les classes</option></select></label><button class="btn acc" onclick="mnGen()">Générer l’aperçu</button></div><div id="mnBox" style="margin-top:12px"></div></div>`+
  `<div class="card"><h2>Export des élèves</h2><p class="sub" style="margin-bottom:12px">Nom en MAJUSCULES, prénom avec majuscule, username modifiable. Les doublons sont détectés en direct.</p><div class="row"><label>Classes<select id="ms2"><option value="c">Classe choisie (ou toutes si aucune)</option><option value="a">Toutes les classes</option></select></label><label>Suffixe du mot de passe<input id="ms3" value="@12345" style="width:110px"></label><label>Date d’inscription<input type="date" id="ms4" value="${today()}"></label><button class="btn acc" onclick="mstuGen()">Générer l’aperçu</button></div><div id="mstuBox" style="margin-top:12px"></div></div>`}
function mnGen(){const m=M();if(!m.lesson.trim())return toast('Saisissez la leçon dans « Sélection & Notes »');
  const L=mPool($('#ms1').value);if(!L.length)return toast('Aucun élève');
  mnCol='Les exercices sur '+m.lesson.trim();
  mnRows=L.map(s=>{const no=m.nodone[s.id],raw=no?m.notN[s.id]:m.doneN[s.id],note=(raw===undefined||raw===''||raw===null)?(no?m.defNot:m.defDone):raw;return{user:s.user||udef(s),cls:s.cls,no,note,fb:no?(m.notDoneFb.trim()||'Les exercices n’ont pas été réalisés.'):(m.doneFb.trim()||'Exercices réalisés.')}});
  $('#mnBox').innerHTML=`<div class="tw"><table><thead><tr><th>user</th><th>Classe</th><th>Statut</th><th>${esc(mnCol)}</th><th>feedbacks</th></tr></thead><tbody>${mnRows.map(r=>`<tr><td>${esc(r.user)}</td><td><span class="pill cl">${esc(r.cls)}</span></td><td class="${r.no?'bad':'ok'}">${r.no?'Pas fait':'A fait'}</td><td>${esc(r.note)}</td><td>${esc(r.fb)}</td></tr>`).join('')}</tbody></table></div><div style="margin-top:12px"><button class="btn acc" onclick="mnDl()">Télécharger le CSV</button></div>`;toast('Aperçu : '+mnRows.length+' ligne(s)')}
function mnDl(){if(!mnRows.length)return;dl('moodle_notes_'+slugF(M().lesson)+'.csv','\uFEFFuser,'+qc(mnCol)+',feedbacks\n'+mnRows.map(r=>qc(r.user)+','+qc(r.note)+','+qc(r.fb)).join('\n')+'\n')}
const fPren=p=>String(p||'').trim().toLowerCase().split(' ').filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const pwdOf=(s,suf)=>{const n=slug(s.last);return n?n.charAt(0).toUpperCase()+n.slice(1)+suf:'Password'+suf};
const mc=(i,f,t,x)=>`<td><input type="${t||'text'}" ${x||''} value="${esc(mstu[i][f])}" oninput="mstuSet(${i},'${f}',this.value)" style="min-width:${t==='date'?140:110}px"></td>`;
function mstuGen(){const L=mPool($('#ms2').value);if(!L.length)return toast('Aucun élève');const suf=$('#ms3').value||'@12345',en=$('#ms4').value||today();
  mstu=L.map(s=>({prenom:fPren(s.first),nom:String(s.last).trim().toUpperCase(),dob:s.dob||'',cls:s.cls,g:s.g==='F'?'fille':s.g==='M'?'garçon':'',user:s.user||udef(s),pwd:s.pwd||pwdOf(s,suf),notes:'',en}));
  $('#mstuBox').innerHTML=`<div class="tw"><table id="mstuTbl"><thead><tr><th>Prénom</th><th>Nom</th><th>Naissance</th><th>Classe</th><th>Genre</th><th>Username ✏️</th><th>Password</th><th>Notes</th><th>Inscription</th></tr></thead><tbody>${mstu.map((r,i)=>`<tr>${mc(i,'prenom')}${mc(i,'nom')}${mc(i,'dob','date')}<td>${esc(r.cls)}</td><td><select onchange="mstuSet(${i},'g',this.value)"><option value="">—</option><option value="fille"${r.g==='fille'?' selected':''}>fille</option><option value="garçon"${r.g==='garçon'?' selected':''}>garçon</option></select></td>${mc(i,'user','text','data-f="user"')}${mc(i,'pwd')}${mc(i,'notes')}${mc(i,'en','date')}</tr>`).join('')}</tbody></table></div><div style="margin-top:12px"><button class="btn acc" onclick="mstuDl()">Télécharger le CSV élèves</button></div>`;mstuDup();toast('Aperçu : '+mstu.length+' élève(s)')}
function mstuSet(i,f,v){if(f==='user')v=v.trim().toLowerCase().replace(/ /g,'.');mstu[i][f]=v;if(f==='user')mstuDup()}
function mstuDup(){const c={};mstu.forEach(r=>{const u=r.user.trim().toLowerCase();c[u]=(c[u]||0)+1});document.querySelectorAll('#mstuTbl input[data-f="user"]').forEach((el,i)=>{const u=mstu[i].user.trim().toLowerCase();el.style.borderColor=(!u||c[u]>1)?'var(--bad)':''})}
async function mstuDl(){if(!mstu.length)return;const pb=[],c=new Set();mstu.forEach((r,i)=>{const u=r.user.trim().toLowerCase();if(!u)pb.push('Ligne '+(i+1)+' : username vide');else if(c.has(u))pb.push('Ligne '+(i+1)+' : username « '+u+' » en double');c.add(u)});
  if(pb.length&&!await ask(pb.length+' problème(s) détecté(s) :\n\n'+pb.slice(0,10).join('\n')+'\n\nTélécharger quand même ?'))return;
  dl('moodle_eleves_'+today()+'.csv','\uFEFF'+['Prénom,Nom,Date de naissance,Classe,Genre,Username,Password,Notes,Date d\'inscription',...mstu.map(r=>[r.prenom,r.nom,r.dob,r.cls,r.g,r.user,r.pwd,r.notes,r.en?dateFr(r.en):''].map(qc).join(','))].join('\n'))}
/* ===== Pagination et tableau de bord moderne ===== */
const PG={stu:{p:1,s:10},dash:{p:1,s:5}};
const PGR={stu:()=>{$('#slist').innerHTML=stuList()},dash:()=>keep()};
function goPg(k,p){PG[k].p=p;PGR[k]()}
function setPs(k,s){PG[k].s=+s;PG[k].p=1;PGR[k]()}
const slicePg=(k,L)=>{const g=PG[k],pages=Math.max(1,Math.ceil(L.length/g.s));g.p=Math.min(Math.max(1,g.p),pages);return L.slice((g.p-1)*g.s,g.p*g.s)};
function pager(k,n,sizes){const g=PG[k],pages=Math.max(1,Math.ceil(n/g.s));g.p=Math.min(Math.max(1,g.p),pages);if(n<=sizes[0])return'';
  const b=Math.min(pages,Math.max(1,g.p-2)+4),nums=[];for(let i=Math.max(1,b-4);i<=b;i++)nums.push(i);
  return `<div class="pager"><span class="sub">${(g.p-1)*g.s+1}–${Math.min(n,g.p*g.s)} sur ${n}</span><div class="pbtns"><button class="pb" aria-label="Page précédente" ${g.p<2?'disabled':''} onclick="goPg('${k}',${g.p-1})">‹</button>${nums.map(i=>`<button class="pb${i===g.p?' on':''}" onclick="goPg('${k}',${i})">${i}</button>`).join('')}<button class="pb" aria-label="Page suivante" ${g.p>=pages?'disabled':''} onclick="goPg('${k}',${g.p+1})">›</button></div><label class="psz">Par page<select onchange="setPs('${k}',this.value)">${sizes.map(s=>`<option value="${s}"${s===g.s?' selected':''}>${s}</option>`).join('')}</select></label></div>`}
function dashView(st,avgs,watch){
  const recs=Object.entries(S.att),pres=recs.filter(x=>x[1]!=='absent').length,rate=recs.length?Math.round(pres/recs.length*100):null;
  const mean=avgs.length?avgs.reduce((a,b)=>a+b,0)/avgs.length:null,f=st.filter(s=>s.g==='F').length,m=st.filter(s=>s.g==='M').length,aa=avgAge(),rem=reminders();
  const hr=new Date().getHours(),hello=hr<12?'Bonjour':hr<18?'Bon après-midi':'Bonsoir',dt=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const kpi=(ic,v,l,x)=>`<div class="kpi"><span class="kic">${ic}</span><b>${v}</b><span class="kl">${l}</span>${x||''}</div>`;
  const bar=p=>`<div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;
  const bands=[['< 8',a=>a<8,'var(--bad)'],['8 – 10',a=>a>=8&&a<10,'var(--warn)'],['10 – 12',a=>a>=10&&a<12,'var(--acc)'],['12 – 14',a=>a>=12&&a<14,'var(--ok)'],['14 – 16',a=>a>=14&&a<16,'var(--ok)'],['16 +',a=>a>=16,'var(--ok)']];
  const cnt=bands.map(b=>avgs.filter(b[1]).length),mx=Math.max(1,...cnt);
  const days=[0,1,2,3,4,5,6].map(i=>addD(today(),i-6)),att=days.map(d=>{const r=recs.filter(x=>x[0].startsWith(d+'_'));return r.length?Math.round(r.filter(x=>x[1]!=='absent').length/r.length*100):null});
  const part=slicePg('dash',watch);
  return `<section class="hero"><div><h2>${hello} 👋</h2><p>${dt.charAt(0).toUpperCase()+dt.slice(1)}</p><p class="hl">${watch.length} élève(s) à suivre · ${rem.length} rappel(s) cette semaine</p></div><div class="hq"><button class="btn acc" onclick="go('students')">Ajouter un élève</button><button class="btn glass" onclick="go('att')">Présences du jour</button><button class="btn glass" onclick="go('work')">Créer un devoir</button></div></section>`+
  `<div class="kpis">${kpi('🎓',st.length,'élèves',`<span class="ks">👧 ${f} · 👦 ${m}</span>`)}${kpi('🏫',classes().length,'classes')}${kpi('📈',fmt(mean),'moyenne générale',mean==null?'':bar(mean/20*100))}${kpi('✅',rate==null?'—':rate+' %','taux de présence',rate==null?'':bar(rate))}${kpi('🎂',aa==null?'—':aa,'âge moyen (ans)')}${kpi('📝',S.assign.filter(a=>!a.archived).length,'devoirs actifs')}</div>`+
  `<div class="dcols"><div><div class="card"><h2>Élèves à suivre (${watch.length})</h2>${watch.length?part.map(w=>`<div class="wi"><span class="av">${esc(((w.s.first||'')[0]||'')+((w.s.last||'')[0]||'')).toUpperCase()}</span><div style="flex:1;min-width:0"><b>${esc(nmOf(w.s))}</b> <span class="pill cl">${esc(w.s.cls)}</span><div style="margin-top:4px"><span class="chip ${w.a==null?'info':w.a<8?'bad':''}">${esc(w.why)}</span></div></div><button class="btn ghost sm" onclick="detail('${w.s.id}')">Détail</button></div>`).join('')+pager('dash',watch.length,[5,10,20]):'<p class="empty">Personne à suivre pour le moment. 🎉</p>'}</div>`+
  `<div class="card"><h2>Répartition des moyennes</h2>${avgs.length?bands.map((b,i)=>`<div class="hb"><span>${b[0]}</span><div class="bar"><i style="width:${cnt[i]/mx*100}%;background:${b[2]}"></i></div><b>${cnt[i]}</b></div>`).join(''):'<p class="empty">Aucune moyenne calculée pour le moment.</p>'}</div></div>`+
  `<div>${remCard()||'<div class="card"><h2>Rappels de la semaine</h2><p class="empty">Rien de prévu cette semaine.</p></div>'}<div class="card"><h2>Présences — 7 derniers jours</h2><div class="cbars">${att.map((p,i)=>`<div class="cb"><div class="cbv"><i style="height:${p==null?3:p}%;${p==null?'opacity:.25':''}"></i></div><span>${DJ[new Date(days[i]+'T00:00:00Z').getUTCDay()].slice(0,3)}</span><small>${p==null?'—':p+'%'}</small></div>`).join('')}</div></div></div></div>`;
}
/* Confirmation intégrée à l’application : confirm() natif fige le clavier des champs de saisie dans Electron/WebView (recherche, ajout d’élève…) */
function ask(msg,ok){return new Promise(res=>{let d=document.getElementById('askd');if(!d){d=document.createElement('dialog');d.id='askd';d.style.width='min(440px,92vw)';document.body.appendChild(d)}
  d.innerHTML=`<p style="white-space:pre-line;margin:0 0 18px">${esc(msg)}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" id="askn">Annuler</button><button class="btn" id="asky" style="background:var(--bad);color:#fff">${esc(ok||'Confirmer')}</button></div>`;
  let fin=false;const done=v=>{if(fin)return;fin=true;try{d.close()}catch(e){}try{window.focus()}catch(e){}res(v)};
  d.querySelector('#askn').onclick=()=>done(false);d.querySelector('#asky').onclick=()=>done(true);d.oncancel=()=>done(false);d.showModal()})}
/* Statistiques par devoir : rendus, moyenne, meilleure note, plus basse, absents */
function wStats(a){
  const L=S.students.filter(s=>a.cls==='toutes'||s.cls===a.cls),g=L.map(s=>({s,n:S.grades[a.id+'_'+s.id]})).filter(x=>x.n!==undefined),n=g.map(x=>x.n);
  const best=n.length?Math.max(...n):null,low=n.length?Math.min(...n):null,names=v=>g.filter(x=>x.n===v).map(x=>nmOf(x.s)).join(', ');
  return{tot:L.length,done:g.length,abs:L.length-g.length,absN:L.filter(s=>S.grades[a.id+'_'+s.id]===undefined).map(nmOf).join(', '),avg:n.length?n.reduce((p,c)=>p+c,0)/n.length:null,best,low,bestN:best==null?'':names(best),lowN:low==null?'':names(low)};
}
function wCard(a){
  const st=wStats(a),cor=a.type==='correction',num=v=>cor||v==null?'—':fmt(v),box=(l,v,t,c)=>`<div class="st" title="${esc(t||'')}"><span>${l}</span><b class="${c||''}">${v}</b></div>`;
  return `<div class="dcard" data-q="${esc(norm(a.title+' '+TN[a.type]+' '+a.cls+' '+(a.subject||'')))}" style="${a.archived?'opacity:.6':''}"><div class="dhead"><div><div class="dt">${TE[a.type]} ${esc(a.title)}</div><div class="sub">${TN[a.type]} · ${Math.round(W[a.type]*100)} % · ${a.cls==='toutes'?'Toutes les classes':esc(a.cls)}${a.subject?' · '+esc(a.subject):''}${a.due?' · à rendre le '+dateFr(a.due):''}${a.archived?' · archivé':''}</div></div><div class="dact"><button class="btn sm" onclick="grades('${a.id}')">Saisir les notes</button><button class="btn ghost sm" onclick="expWork('${a.id}')">Excel</button><button class="btn ghost sm" onclick="arch('${a.id}')">${a.archived?'Désarchiver':'Archiver'}</button><button class="btn del sm" onclick="delWork('${a.id}')">Supprimer</button></div></div>`+
  `<div class="dstats">${box('📥 Rendus',st.done+'/'+st.tot,'','')}${box('📊 Moyenne',num(st.avg),'',st.avg==null||cor?'':st.avg<10?'bad':'ok')}${box('🏆 Meilleure note',num(st.best),st.bestN,'')}${box('📉 Plus basse',num(st.low),st.lowN,'')}${box('🚫 Absents',st.abs,st.absN,st.abs?'bad':'')}</div></div>`;
}
async function reset(){if(await ask('Effacer toutes les données ?','Tout effacer')){S={students:[],assign:[],grades:{},att:{}};save();render()}}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
render();
if(reminders().length)setTimeout(()=>toast('🔔 '+reminders().length+' rappel(s) cette semaine'),600);
pushNotifs();setInterval(()=>{const t=today();if(t!==lastDay){lastDay=t;render();pushNotifs()}},600000);
</script>
